name: Build & Test
on:
  pull_request:
  push:
    branches: [master]
jobs:
  build:
    name: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: build legacy source against installed .NET Framework references
        shell: pwsh
        run: |
          $project = "Version 3\src\Cassini++\Cassini++.csproj"
          (Get-Content $project -Raw) -replace '<TargetFrameworkVersion>v4.0</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>' | Set-Content $project
      - name: build
        run: msbuild "Version 3/Piw.sln" /p:Configuration=Release /m
